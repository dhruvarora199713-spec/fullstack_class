<!DOCTYPE html>
<html>
<head>
    <title>Button Hover</title>

    <style>
        button {
            background-color: blue;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border: none;
        }

        .btn1:hover {
            background-color: red;
            color: yellow;
            font-size: 25px;
        }
         .btn2:hover {
            background-color: red;
            color: rgb(0,255,255);
            font-size: 25px;
        }
         .btn3:hover {
            background-color: red;
            color: #2374f2;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <button>Hover Over Me</button>
    <button>Hover Over Me</button>
    <button>Hover Over Me</button>


</body>
</html>
