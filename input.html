<!DOCTYPE html>
<html>
<head>
    <title>Input Focus</title>

    <style>
        input {
            padding: 10px;
            border: 2px solid black;
            background-color: white;
        }

        input:focus {
            border-color: blue;
            background-color: lightyellow;
            outline: none;
        }
    </style>
</head>

<body>

    <input type="text" placeholder="Enter your name">

</body>
</html>
