<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Styling</title>

    <style>
        p::first-letter {
            font-size: 50px;
            font-weight: bold;
        }

        p::first-line {
            color: blue;
        }
    </style>
</head>

<body>

    <p>
        Learning HTML and CSS is very interesting.
        CSS provides many ways to style webpages.
        We can change colors, fonts, sizes and layouts.
    </p>

</body>
</html>
