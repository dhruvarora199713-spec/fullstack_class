<!DOCTYPE html>
<html>
<head>
    <title>About Us</title>

    <style>

        /* Element Selector */
        body{
            font-family: Arial, sans-serif;
            background-color:#f2f2f2;
            margin:20px;
        }

        h1{
            text-align:center;
            color:#0066cc;       /* HEX Color */
        }

        /* ID Selector */
        #intro{
            color:rgb(255,0,0);   /* RGB Color */
            font-size:18px;
        }

        /* Class Selector */
        .box{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 8px gray;
            margin-bottom:20px;
        }

        /* Ordered List */
        ol{
            color:#008000;
            font-size:18px;
        }

        /* Unordered List */
        ul{
            color:rgb(128,0,128);
            font-size:18px;
        }

        /* Pseudo Class */
        li:hover{
            color:white;
            background:#ff6600;
            cursor:pointer;
        }

    </style>

</head>

<body>

<h1>About Us</h1>

<div class="box">

<p id="intro">
Welcome to our webpage. We are learning HTML and CSS.
This page demonstrates different CSS selectors and color formats.
</p>

</div>

<div class="box">

<h2>Favorite Movies</h2>

<ol>
    <li>Interstellar</li>
    <li>Avengers: Endgame</li>
    <li>Spider-Man: No Way Home</li>
    <li>Inception</li>
</ol>

</div>

<div class="box">

<h2>Favorite Cities</h2>

<ul>
    <li>Delhi</li>
    <li>Mumbai</li>
    <li>Jaipur</li>
    <li>Bengaluru</li>
</ul>

</div>

</body>
</html>
